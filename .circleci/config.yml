version: 2.1
jobs:
  build:
    docker:
      - image: python:3.7.5
    steps:
      - checkout
      - run:
          name: "Testing"
          shell: /bin/bash
          command: |
            pip install coverage
            pip install -r requirements.txt
            pip install codecov
            python -m unittest discover -s tests -v
            coverage run tests.py
      - run:
          name: get test coverage
          command: coverage
          when: always

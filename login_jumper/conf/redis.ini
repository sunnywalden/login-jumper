# coding=utf-8
# 示例配置，只指向本机回环地址，口令留空。
# 真实口令请用环境变量，或同目录下已被 git 忽略的 redis.local.ini。
# 单机：LOGIN_JUMPER_SINGLE_HOST / PORT / DATABASE / PASSWORD
# 集群口令：LOGIN_JUMPER_CLUSTER_PASSWORD
# 仍兼容未加前缀的 host、port、database、password。

[single]
host = 127.0.0.1
port = 6379
database = 2
password =

[cluster]
password =
database = 1
nodes = [{"host": "127.0.0.1", "port": "6380"}, {"host": "127.0.0.1", "port": "6381"}, {"host": "127.0.0.1", "port": "6382"}]

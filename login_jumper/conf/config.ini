# coding=utf-8
# 配置管理
# 本文件只保留本机示例。真实堡垒机地址和监控 token 请用环境变量，
# 或同目录下已被 git 忽略的 config.local.ini。

[Server]
# 堡垒机地址。默认回环，避免示例配置连到其他主机。
# 覆盖：jumper_host 或 LOGIN_JUMPER_SERVER_JUMPER_HOST
jumper_host = 127.0.0.1
# 堡垒机ssh端口
# 覆盖：jumper_port 或 LOGIN_JUMPER_SERVER_JUMPER_PORT
jumper_port = 22

[Session]
# 会话超时时长
alive_interval = 20000000000

[System]
# .bash_profile路径
system_profile = ~/.bash_profile

[App]
# 监控 token 留空。使用环境变量 roll_bar、sentry_id 注入。
roll_bar =
sentry_id =
